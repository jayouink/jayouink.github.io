<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>영어 회화 패턴 50일 챌린지 | Day 1~50 테스트</title>
<meta name="description" content="영어 회화 패턴 100을 하루 2패턴씩 50일. 원어민 음성 듣기 포함 Day별 10문제, 10일마다 누적 20문제. 큰 글씨. 곽승범 원장">
<meta property="og:type" content="website"><meta property="og:title" content="영어 회화 패턴 50일 챌린지">
<meta property="og:description" content="하루 2패턴 · 원어민 음성 · Day별 10문제 자동 채점 · 10일마다 누적 테스트">
<meta property="og:image" content="https://jayouink.github.io/og_pattern.png"><meta property="og:url" content="https://jayouink.github.io/pattern.html"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} body{margin:0;background:#1b2340;color:#fff;font-family:Pretendard,system-ui,sans-serif;font-size:19px}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 48px;min-height:100vh}
.pill{display:inline-block;background:#FFD54A;color:#111;font-weight:800;font-size:16px;padding:6px 14px;border-radius:20px}
h1{font-size:32px;line-height:1.3;margin:14px 0 8px;font-weight:900} .sub{color:#c3cbe6;font-size:19px;line-height:1.65}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:20px;font-size:22px;font-weight:900;font-family:inherit;cursor:pointer;margin-top:14px;text-align:center;text-decoration:none}
.btn.y{background:#FFD54A;color:#111} .btn.g{background:#2d3866;color:#fff}
h3{font-size:22px;margin:28px 0 4px;color:#FFD54A} .hint{color:#c3cbe6;font-size:16px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.grid a{display:block;background:#2d3866;border-radius:12px;padding:12px 2px 10px;text-align:center;color:#fff;text-decoration:none;font-weight:900;font-size:18px;line-height:1.25}
.grid a small{display:block;font-size:13px;color:#aab4d4;font-weight:700;margin-top:3px}
.grid a.done{background:#2f6f52} .grid a.done small{color:#d5f5e3}
.grid a.set{background:#3a3270} .grid a.set.done{background:#2f6f52}
.blk{font-size:16px;color:#cfd6ee;font-weight:800;margin:18px 0 0}
.stat{display:flex;gap:10px;margin-top:16px} .stat div{flex:1;background:#26305a;border-radius:14px;padding:14px;text-align:center;font-size:17px} .stat b{display:block;font-size:30px;color:#FFD54A}
.ft{text-align:center;color:#8f99c0;font-size:15px;margin-top:30px;line-height:1.7}
</style></head>
<body><div class="wrap" id="app"></div>
<script>
const CFG={key:'pt',posts:'pattern_posts.json',self:'pattern_day.html',days:50,setDays:10,time:'아침 9시 30분'};
const LV=d=>d<=20?'초급':d<=37?'중급':d===38?'중급·고급':'고급';
let POSTS={cat:'https://blog.naver.com/jayouink2'};
function ls(k){try{return JSON.parse(localStorage.getItem(k)||'null')||{}}catch(e){return {}}}
function render(){
  const D=ls(CFG.key+'Day'),SS=ls(CFG.key+'Set'),nd=Object.keys(D).length;
  let next=1;for(let d=1;d<=CFG.days;d++){if(D[d]==null){next=d;break}}
  let h=`<span class="pill">영어 회화 패턴 50일 챌린지</span><h1>영어 회화 패턴 100<br>하루 2패턴, 50일 완성</h1>
  <p class="sub">블로그 무료 PDF 「영어 회화 패턴 100」과 번호·예문이 똑같아요. 매일 소리 내어 따라 말하고, Day 테스트로 확인하세요.</p>
  <div class="stat"><div><b>${nd}</b>완료한 Day</div><div><b>${Object.keys(SS).length}</b>완료한 누적 테스트</div></div>
  <a class="btn y" href="${CFG.self}?day=${next}">Day ${next} 시작 ▶</a>
  <a class="btn g" href="${POSTS.cat}">블로그 연재 보기 (매일 ${CFG.time})</a>
  <h3>Day 1~${CFG.days}</h3><div class="hint">초록색 = 완료한 Day (숫자는 최고 점수). 이 휴대폰에만 저장돼요.</div>`;
  for(let k=1;k<=CFG.days/CFG.setDays;k++){
    const a=(k-1)*CFG.setDays+1,b=k*CFG.setDays;
    h+=`<div class="blk">Day ${a}~${b} · 패턴 ${2*a-1}~${2*b}번</div><div class="grid">`;
    for(let d=a;d<=b;d++)h+=`<a href="${CFG.self}?day=${d}" class="${D[d]!=null?'done':''}">${d}<small>${D[d]!=null?D[d]+'점':LV(d)}</small></a>`;
    h+=`</div>`;
  }
  h+=`<h3>10일 누적 테스트</h3><div class="hint">10일마다 20패턴에서 20문제. 오래 기억했는지 확인해요.</div><div class="grid">`;
  for(let k=1;k<=CFG.days/CFG.setDays;k++)h+=`<a class="set ${SS[k]!=null?'done':''}" href="${CFG.self}?set=${k}">누적 ${k}<small>${SS[k]!=null?SS[k]+'점':'Day '+((k-1)*10+1)+'~'+k*10}</small></a>`;
  h+=`</div><div class="ft">영어 회화 패턴 100 · 초급 1~40, 중급 41~75, 고급 76~100<br>곽승범 원장 · 유튜브 영어 혁명</div>`;
  document.getElementById('app').innerHTML=h;
}
render();
fetch(CFG.posts+'?t='+Date.now()).then(r=>r.json()).then(j=>{POSTS=j;render()}).catch(()=>{});
</script></body></html>
