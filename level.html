  const sc = Q.reduce((s,q,i)=>s+(ok[i]?PTS[q.t]:0),0); const n = ok.filter(Boolean).length; const lv = lvOf(sc); const sec = Math.round((Date.now()-t0)/1000);
  const dt = new Date(); store.set('lvLast', {lv:lv.n, name:lv.name, sc, d:(dt.getMonth()+1)+'/'+dt.getDate()}); const sn = (store.get('lvSeen')||[]).filter(x=>!Q.some(q=>q.id===x)).concat(Q.map(q=>q.id)); store.set('lvSeen', sn.slice(-300)); window.__result = {sc, n, lv:lv.n};
  [523.3,659.3,784].forEach((f,i)=>setTimeout(()=>beep(f,0.25,0.18), i*120));
  const grp = (f) => { const m={}; Q.forEach((q,i)=>{ const k=f(q); m[k]=m[k]||[0,0]; m[k][1]++; if (ok[i]) m[k][0]++; }); return m; };
  const byT = grp(q=>TIERNAME[q.t]); const byA = grp(q=>q.a);
  const meter = (k,v,c) => '<div class="meter"><div class="lb"><span>'+esc(k)+'</span><span>'+v[0]+' / '+v[1]+'</span></div><div class="tr"><i style="width:'+(v[0]/v[1]*100)+'%;background:'+c+'"></i></div></div>';
  const weak = Object.entries(byA).filter(([k,v])=>v[0]<v[1]).sort((a,b)=>(a[1][0]/a[1][1])-(b[1][0]/b[1][1])).slice(0,2).map(x=>x[0]);
  app.innerHTML = '<span class="pill">영어 문법 레벨 테스트 결과</span><div class="score">'+n+' / 20문제 정답 · '+Math.floor(sec/60)+'분 '+(sec%60)+'초</div><div class="big">'+sc+'점</div><div class="lvname">Level '+lv.n+' · '+lv.name+(lv.top?' <span style="font-size:15px;color:#aab4d4;font-weight:700">('+lv.top+')</span>':'')+'</div>'+
  '<div class="lvbars">'+LV.map((l,i)=>'<div class="'+(l.n===lv.n?'on':'')+'" style="height:'+(44+i*14)+'px">'+l.n+'<small>'+l.name.replace(' 마스터','+')+'</small></div>').join('')+'</div>'+
  '<div class="box" style="margin-top:12px">'+lv.d+(weak.length?'<br><b>먼저 볼 영역:</b> '+weak.map(esc).join(', '):'')+'</div>'+
  '<h3>난이도별 정답</h3>'+['초급','중급','고급','최고급'].map(k=>meter(k,byT[k],k==='초급'?'#5fcf96':k==='중급'?'#6ea8ff':k==='고급'?'#ff8fb1':'#FFD54A')).join('')+
  '<h3>영역별 정답</h3>'+Object.entries(byA).sort((a,b)=>b[1][1]-a[1][1]).map(([k,v])=>meter(k,v,v[0]===v[1]?'#5fcf96':v[0]===0?'#ff8a80':'#FFD54A')).join('')+
  '<button class="btn y" onclick="share()">결과 공유하기</button><button class="btn g" onclick="start()">새 문제로 다시 풀기</button>'+
  '<h3>문제별 채점 (틀린 문제 '+(20-n)+'개)</h3>'+Q.map((q,i)=>{ const a=ans[i]; const pickTxt = a===undefined?'안 풂':a===-1?'잘 모르겠어요':q.w[a]; return '<div class="rv"><div class="h"><span>'+(i+1)+'번 · '+TIERNAME[q.t]+' · '+esc(q.a)+'</span><span class="'+(ok[i]?'o':'x')+'">'+(ok[i]?'○ +'+PTS[q.t]+'점':'✕ 0점')+'</span></div><div class="s">'+phr(q)+'</div>'+(ok[i]?'':'<div class="y">내 답: '+esc(pickTxt)+'</div>')+'<div class="ok">→ '+esc((q.r||q.w).join(' '))+'</div><div class="y">'+esc(q.c)+(q.y.length?' · '+q.y.map(esc).join(' '):'')+'</div></div>'; }).join('')+
  '<div class="box"><b>「중학 서술형 영작 엔진 1」</b><br>틀린 곳은 보이는데 막상 직접 쓰면 감점된다면, 정확한 한 문장을 쓰는 훈련이 필요해요. 단어를 덩어리로 키우고, 영어 자리에 넣고, 틀린 판단을 고쳐 다시 쓰는 순서로 영어 서술형 감점을 줄여요.</div>'+
  '<a class="btn g" href="./">틀리면 끝! 10단계 도전 테스트</a>'+
  '<div class="box">매일 새 문제 ▶ <a class="lk" href="https://www.youtube.com/@THEOPEN_Kwak" target="_blank">유튜브 영어 혁명</a> · <a class="lk" href="https://blog.naver.com/jayouink2" target="_blank">블로그</a> · <a class="lk" href="https://www.instagram.com/jayouink2" target="_blank">인스타그램</a></div><div class="ft">곽승범 원장</div>';
  window.scrollTo(0,0); }
async function share(){ const r=window.__result; const l=LV[r.lv-1]; const t='영어 문법 레벨 테스트 20문제: '+r.sc+'점, Level '+r.lv+' '+l.name+'! 당신은 몇 레벨?'; const u=location.origin+location.pathname; try { if (navigator.share) { await navigator.share({title:'영어 문법 레벨 테스트', text:t, url:u}); return; } await navigator.clipboard.writeText(t+' '+u); alert('결과와 링크를 복사했어요. 원하는 곳에 붙여 넣어 공유하세요!'); } catch(e){} }
home();
</script></body></html>
