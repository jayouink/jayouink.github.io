const done = () => { try { return JSON.parse(localStorage.getItem('gtDone10')||'{}'); } catch(e){ return {}; } };
function stairs(cur){ return '<div class="stairs">'+LABEL.map((l,i)=>{ const h=46+i*9; let c=''; if (i===cur) c='on'; else if (res[i]!==undefined) c = res[i]?'ok':'no'; return '<div class="st '+c+'" style="height:'+h+'px">'+(i+1)+'<small>'+l.replace('상위 ','')+'</small></div>'; }).join('')+'</div>'; }
function home(){ const d=done(); rs(location.pathname); app.innerHTML='<span class="pill">10단계 문법 테스트</span><h1>영어 문법,<br>당신은 상위 몇 %?</h1><div class="sub">틀린 곳을 찾으면 다음 단계로! 한 번 틀리면 거기서 끝나요.<br>세트를 골라 어디까지 오르는지 도전해 보세요.<br>유튜브 계단 쇼츠 #번호 = Set 번호예요.</div><a class="btn y" href="?set='+SETS[0].set+'" onclick="go('+SETS[0].set+');return false;">Set '+SETS[0].set+'부터 시작</a><div class="q" style="color:#aab4d4;margin-top:22px">세트 고르기 (초록색은 푼 세트)</div><div class="grid">'+SETS.map(s=>'<a href="?set='+s.set+'" class="'+(d[s.set]!==undefined?'done':'')+'" onclick="go('+s.set+');return false;">'+s.set+'</a>').join('')+'</div><div class="ft">곽승범 원장 · 유튜브 영어 혁명</div>'; window.scrollTo(0,0); }
function go(n){ S=SETS.find(s=>s.set===n); if(!S) return home(); rs('?set='+n); st=0; res=[]; stage(); }
function head(){ return '<span class="pill">10단계 문법 테스트</span><span class="setno">Set '+S.set+'</span>'; }
function stage(){ const it=S.items[st]; const last=st===9;
  app.innerHTML = head()+stairs(st)+'<div class="stage '+(last?'last':'')+'">'+(last?'마지막 10단계 · 상위 3%':(st+1)+'단계 · '+LABEL[st])+'</div><div class="card"><div class="q">틀린 곳을 눌러 주세요</div><div class="chips">'+it.w.map((w,i)=>'<button class="chip" data-i="'+i+'">'+esc(w)+'</button>').join('')+'</div><div id="r1" class="res"></div></div><div id="r2"></div>';
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ if (res[st]!==undefined) return; const i=+b.dataset.i; const ok=it.b.includes(i); res[st]=ok; if(!ok) b.classList.add('pick'); it.b.forEach(j=>app.querySelector('.chip[data-i="'+j+'"]').classList.add('bad')); const r=document.getElementById('r1'); r.className='res '+(ok?'o':'x'); r.textContent= ok?'정답! 틀린 곳을 찾았어요.':'아쉬워요. 빨간 부분이 틀린 곳이에요.';
    document.getElementById('r2').innerHTML='<div class="ans"><div class="t">바른 문장</div><b>'+esc((it.r||it.w).join(' '))+'</b><div style="margin-top:6px;font-size:13.5px">'+esc(it.c)+'</div></div><div class="why">'+it.y.map(esc).join('<br>')+'</div><button class="btn y" onclick="next()">'+(!ok||st===9?'결과 보기':'다음 단계로')+'</button>'; });
  window.scrollTo(0,0); }
function next(){ if (res[st]===false) return result(); st++; if (st<10) stage(); else result(); }
function pct(s){ return s===0 ? '1단계 탈락' : LABEL[s-1]; }
function result(){ let s=0; while (s<10 && res[s]===true) s++; const p=pct(s); const failed = s<10; window.__result={s,p,set:S.set}; const d=done(); d[S.set]=s; try{localStorage.setItem('gtDone10',JSON.stringify(d));}catch(e){}
  const nx = SETS.find(x=>x.set>S.set);
  app.innerHTML = head()+'<div class="score">'+(s===10?'10단계 모두 통과!':s===0?'아쉽게 1단계에서 멈췄어요':s+'단계까지 통과, '+(s+1)+'단계에서 멈췄어요')+'</div><div class="big">'+(s===0?'다시 도전!':'당신은 '+p)+'</div>'+stairs(-1)+LABEL.map((l,i)=>'<div class="row"><span>'+(i+1)+'단계 · '+l+'</span><span>'+(res[i]===true?'○ 통과':res[i]===false?'✕ 여기서 멈춤':'–')+'</span></div>').join('')+
  (failed?'<a class="btn y" href="?set='+S.set+'" onclick="go('+S.set+');return false;">같은 세트 다시 도전</a>':'')+'<button class="btn '+(failed?'g':'y')+'" onclick="share()">결과 공유하기</button>'+(nx?'<a class="btn g" href="?set='+nx.set+'" onclick="go('+nx.set+');return false;">다음 세트 (Set '+nx.set+') 도전</a>':'')+'<a class="btn g" href="./" onclick="home();return false;">다른 세트 고르기</a>'+
  '<div class="book"><b>「중학 서술형 영작 엔진 1」</b><br>틀린 곳은 보이는데 막상 직접 쓰면 감점된다면, 정확한 한 문장을 쓰는 훈련이 필요해요. 단어를 덩어리로 키우고, 영어 자리에 넣고, 틀린 판단을 고쳐 다시 쓰는 순서로 서술형 감점을 줄여요.</div>'+
  '<div class="book">매일 새 문제 ▶ <a class="lk" href="https://www.youtube.com/@THEOPEN_Kwak" target="_blank">유튜브 영어 혁명</a> · <a class="lk" href="https://blog.naver.com/jayouink2" target="_blank">블로그</a> · <a class="lk" href="https://www.instagram.com/jayouink2" target="_blank">인스타그램</a></div><div class="ft">곽승범 원장</div>'; window.scrollTo(0,0); }
async function share(){ const r=window.__result; const t='영어 문법 10단계 테스트 Set '+r.set+': '+(r.s===0?'1단계부터 막혔어요':r.s+'단계 통과, 나는 '+r.p)+'! 당신은 몇 단계까지?'; const u=location.origin+location.pathname+'?set='+r.set; try { if (navigator.share) { await navigator.share({title:'영어 문법, 당신은 상위 몇 %?', text:t, url:u}); return; } await navigator.clipboard.writeText(t+' '+u); alert('결과와 링크를 복사했어요. 원하는 곳에 붙여 넣어 공유하세요!'); } catch(e){} }
const n = +(new URLSearchParams(location.search).get('set')); if (n && SETS.find(s=>s.set===n)) go(n); else home();
</script></body></html>
