<body><div class="wrap" id="app"><p class="sub">불러오는 중...</p></div>
<script>
const CFG=/*CFG*/{"key":"sn","data":"suneung_words.json","posts":"suneung_posts.json","hub":"suneung.html","self":"suneung_day.html","cat":"https://blog.naver.com/PostList.naver?blogId=jayouink2&categoryNo=23","days":100,"perDay":30,"dayQ":20,"setDays":10,"setQ":50,"name":"수능 영단어","series":"수능 필수 어휘 100일 챌린지","goal":"수능 필수 어휘 3,000개","foot":"수능 필수 어휘 3000 · 평가원 수능·모의평가 30회분 출현 단어 중심","time":"아침 7시","v":2,"bank":"suneung_bank.json","mix":{"b":0.4,"p":0.2,"k":0.2,"s":0.1,"e":0.1}}/*END*/;
const HUB=CFG.hub, CAT_DEFAULT=CFG.cat, S=CFG.setDays;
let BANK={},RETRY=false,WORDS=[], POSTS={days:{},sets:{},cat:CAT_DEFAULT}, MODE='day', N=1, IDS=[], Q=[], cur=0, ans=[], snd=true;
const $=s=>document.querySelector(s), app=()=>$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const POSN={'명':'명사','동':'동사','형':'형용사','부':'부사','전':'전치사','접':'접속사'};
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v));}catch(e){return null}}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function W(i){const x=WORDS[i];return {i,w:x[0],pos:x[1],m:x[2],q:x[3],qp:x[4],d:x[5],mark:x[6],dx:x[7]}}
let VOICE=null; function pickVoice(){try{const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>v.lang==='en-US'&&/Samantha|Google US|Aria|Jenny|Zira/i.test(v.name))||vs.find(v=>v.lang==='en-US')||vs.find(v=>/^en/.test(v.lang))||null;}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice();}catch(e){}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(VOICE)u.voice=VOICE;u.rate=.9;speechSynthesis.speak(u);}catch(e){}}
function blogDay(d){return (POSTS.days&&POSTS.days[d])||POSTS.cat||CAT_DEFAULT}
function blogBack(){return MODE==='day'?blogDay(N):((POSTS.sets&&POSTS.sets[N])||blogDay(N*S))}
function label(){return MODE==='day'?`Day ${N}`:`누적 세트 ${N}`}
async function init(){
  const p=new URLSearchParams(location.search);
  if(p.get('set')){MODE='set';N=Math.min(CFG.days/S,Math.max(1,parseInt(p.get('set'))||1));} else {MODE='day';N=Math.min(CFG.days,Math.max(1,parseInt(p.get('day'))||1));}
  try{const [a,b]=await Promise.all([fetch(CFG.data+'?v='+(CFG.v||1)).then(r=>r.json()),fetch(CFG.posts+'?t='+Date.now()).then(r=>r.json()).catch(()=>null)]);WORDS=a.words;if(b)POSTS=b;try{BANK=(await fetch(CFG.bank+'?v='+(CFG.v||1)+'&t='+Math.floor(Date.now()/36e5)).then(r=>r.json())).days||{};}catch(e){BANK={}}}catch(e){app().innerHTML='<p class="sub">데이터를 불러오지 못했어요. 새로고침해 주세요.</p>';return}
  IDS=WORDS.map((x,i)=>i).filter(i=>MODE==='day'?WORDS[i][5]===N:(WORDS[i][5]>(N-1)*S&&WORDS[i][5]<=N*S));
  document.title=`${CFG.name} ${label()} 테스트 | ${CFG.series}`;
  home();
}
function home(){
  const cnt=MODE==='day'?CFG.dayQ:CFG.setQ, done=ls(CFG.key+(MODE==='day'?'Day':'Set'))||{}, best=done[N];
  const range=MODE==='day'?'':` (Day ${(N-1)*S+1}~${N*S})`;
  let h=`<span class="pill">${CFG.series}</span><h1>${CFG.name} ${label()}${range}<br>${cnt}문제 자동 채점</h1>
  <p class="sub">${MODE==='day'?`오늘의 ${CFG.perDay}단어 중 ${CFG.dayQ}문제`:`${CFG.perDay*S}단어 중 ${CFG.setQ}문제`}가 나와요. 수능처럼 <b>문맥 빈칸·다의어·혼동 어휘</b>로 나오니 뜻만 외워서는 다 맞히기 어려워요. 누르면 바로 정답과 해설을 보여 주고, 끝나면 틀린 단어를 정리해 드려요.</p>
  ${best!=null?`<div class="box">지난 기록: <b>${best}점</b> 완료</div>`:''}
  <button class="btn y" onclick="start()">테스트 시작 ▶</button>`;
  if(MODE==='day'){
    h+=`<button class="btn g" onclick="toggleList()">오늘의 ${CFG.perDay}단어 먼저 보기</button><div id="list"></div>`;
    if(N>1)h+=`<a class="btn o" href="${CFG.self}?day=${N-1}">어제 Day ${N-1} 다시 풀기</a>`;
  }
  h+=`<a class="btn g" href="${HUB}">전체 Day·세트 보기</a><a class="btn g" href="${esc(blogBack())}">블로그로 돌아가기</a>`+foot();
  app().innerHTML=h;window.scrollTo(0,0);
}
function toggleList(){const el=$('#list');if(el.innerHTML){el.innerHTML='';return}
  el.innerHTML='<div class="box"><table class="tbl">'+IDS.map(i=>{const x=W(i);return `<tr><td class="e">${esc(x.w)}</td><td class="p">${esc(x.pos)}</td><td>${esc(x.m)}</td></tr>`}).join('')+'</table></div>';}
const IDX={};function idx(w){if(!Object.keys(IDX).length)WORDS.forEach((x,i)=>{IDX[x[0]]=i});return IDX[w]}
function lev(a,b){const m=a.length,n=b.length;let p=Array(n+1).fill(0).map((_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const SYNG=[['따라서','그러므로','그래서','그결과','그것에의하여','이렇게'],['게다가','더욱이','또한','더구나'],['꽤','상당히','비교적','상대적으로','상당'],['중요','중대','결정','핵심'],['얻다','획득','습득','얻'],['제공','공급'],['다양','여러가지'],['분명','명백','뚜렷','확실'],['결과','성과'],['원인','이유'],['필요','필수'],['특정','특별','특유'],['보존','보호','유지'],['관찰','주시'],['주장','요구']];const SYNM={};SYNG.forEach((g,k)=>g.forEach(s=>SYNM[s]='#'+k));
function toks(m){return String(m).split(/[,/·]|\s\/\s/).map(s=>s.replace(/[~()\s]/g,'').replace(/(하다|되다|한|적인|의|하게|히)$/,'')).filter(s=>s.length>0).map(s=>{for(const k in SYNM)if(s.includes(k))return SYNM[k];return s})}
function overlap(i,j){const a=toks(WORDS[i][2]),b=toks(WORDS[j][2]);return a.some(x=>b.some(y=>x===y||(x.length>1&&y.length>1&&(x.includes(y)||y.includes(x)))))}
const CONF={};
function confusables(i){if(CONF[i])return CONF[i];const x=WORDS[i],w=x[0],p=x[4];const sc=[];
  WORDS.forEach((y,j)=>{if(j===i||y[4]!==p)return;const d=lev(w,y[0]);let pre=0;while(pre<Math.min(w.length,y[0].length)&&w[pre]===y[0][pre])pre++;let suf=0;while(suf<Math.min(w.length,y[0].length)&&w[w.length-1-suf]===y[0][y[0].length-1-suf])suf++;
    const s=d/Math.max(w.length,y[0].length)-0.08*Math.min(pre,4)-0.05*Math.min(suf,4);sc.push([s,j])});
  sc.sort((a,b)=>a[0]-b[0]);const out=[];for(const [s,j] of sc){if(out.length>=8)break;if(overlap(i,j))continue;if(out.some(k=>WORDS[k][0]===WORDS[j][0]))continue;out.push(j)}
  return CONF[i]=out}
function pick3(i){const c=confusables(i);const top=shuf(c.slice(0,6)).slice(0,3);return top.length===3?top:shuf(WORDS[i][7][0]).slice(0,3)}
function hardScore(i){const x=WORDS[i];return (String(x[2]).split(/[,/]/).length)+(x[1].includes('·')?1:0)+Math.random()*1.5}
function start(){
  const cnt=MODE==='day'?CFG.dayQ:CFG.setQ, mix=CFG.mix;
  const days=MODE==='day'?[N]:Array.from({length:S},(_,k)=>(N-1)*S+k+1);
  const pool=[];days.forEach(d=>(BANK[d]||[]).forEach(it=>{const i=idx(it.w);if(i!==undefined)pool.push(Object.assign({i},it))}));
  const want={b:Math.round(cnt*mix.b),p:Math.round(cnt*mix.p),s:Math.round(cnt*mix.s)};
  const used=new Set(),Qs=[];
  const take=(types,n)=>{let c=0;for(const it of shuf(pool.filter(q=>types.includes(q.t)))){if(c>=n)break;if(used.has(it.i)&&pool.length>cnt)continue;used.add(it.i);const o=shuf(it.o.map((v,k)=>({v,ok:k===0})));Qs.push({i:it.i,t:it.t,q:it.q,x:it.x,opts:o.map(z=>z.v),ok:o.findIndex(z=>z.ok)});c++}return c};
  let gotB=take(['b'],want.b), gotP=take(['p'],want.p), gotS=take(['s','a'],want.s);
  let short=(want.b-gotB)+(want.p-gotP)+(want.s-gotS);
  const nE=Math.round(cnt*mix.e), nK=cnt-Qs.length-nE;
  const rest=shuf(IDS.filter(i=>!used.has(i))).sort((a,b)=>hardScore(b)-hardScore(a)).concat(shuf(IDS));
  let ri=0;const nextWord=()=>{while(ri<rest.length){const i=rest[ri++];if(!used.has(i)||ri>IDS.length){used.add(i);return i}}return IDS[Math.floor(Math.random()*IDS.length)]};
  for(let k=0;k<nK;k++){const i=nextWord(),o=shuf([i,...pick3(i)]);Qs.push({i,t:'k',opts:o,ok:o.indexOf(i)})}
  for(let k=0;k<nE;k++){const i=nextWord(),o=shuf([i,...pick3(i)]);Qs.push({i,t:'e',opts:o,ok:o.indexOf(i)})}
  RETRY=false;Q=shuf(Qs).slice(0,cnt);cur=0;ans=[];showQ();
}
const QT={b:'빈칸에 들어갈 가장 알맞은 단어는?',p:'밑줄 친 단어의 문맥 속 뜻은?',s:'밑줄 친 단어와 뜻이 가장 가까운 것은?',a:'밑줄 친 단어와 뜻이 반대인 것은?',k:'이 뜻의 영어 단어는? (철자 주의)',e:'이 단어의 뜻은? (비슷한 철자 주의)'};
function sent(q){return esc(q).replace('____','<span class="bl">&nbsp;</span>').replace(/【([^】]+)】/,'<u>$1</u>')}
function showQ(){
  const q=Q[cur],x=W(q.i),tot=Q.length;
  let h=`<div class="prog"><span>${label()} · ${cur+1} / ${tot}</span><span>맞힌 수 ${ans.filter(a=>a===1).length}</span></div><div class="bar"><i style="width:${cur/tot*100}%"></i></div><div class="card"><div class="qt">${QT[q.t]}</div>`;
  if(q.t==='e'){h+=`<div class="qw">${esc(x.w)}</div><button class="spk" onclick="say('${x.w.replace(/'/g,"\\'")}')">발음 듣기 ▶</button>`;}
  else if(q.t==='k'){h+=`<div class="qk"><span class="pos">${POSN[x.qp]||''}</span>${esc(x.q)}</div>`;}
  else h+=`<div class="qs">${sent(q.q)}</div>`;
  const lab=o=>q.t==='e'?esc(W(o).q):q.t==='k'?esc(W(o).w):esc(o);
  const en=q.t!=='e'&&q.t!=='p';
  h+=`<div class="opts">`+q.opts.map((o,k)=>`<button class="op${en?' en':''}" id="op${k}" onclick="pick(${k})"><span class="n">${k+1}</span>${lab(o)}</button>`).join('')+`</div><button class="skip" id="skp" onclick="pick(-1)">모르겠어요</button><div id="fb"></div></div>`;
  app().innerHTML=h;window.scrollTo(0,0);
}
function pick(k){
  const q=Q[cur],x=W(q.i);if(ans[cur]!==undefined)return;
  const right=k===q.ok;ans[cur]=right?1:0;
  document.querySelectorAll('.op').forEach(b=>b.disabled=true);$('#skp').style.display='none';
  $('#op'+q.ok).classList.add('good');if(k>=0&&!right)$('#op'+k).classList.add('bad');
  if(q.t!=='e'||!right)say(x.w);
  let extra='';
  if(q.x)extra=`<div class="xp">${esc(q.x)}</div>`;
  else{const others=q.opts.filter((o,j)=>j!==q.ok).map(o=>W(o));extra=`<div class="xp">헷갈린 보기: ${others.map(y=>`<b>${esc(y.w)}</b> ${esc(y.q)}`).join(' · ')}</div>`;}
  $('#fb').innerHTML=`<div class="fb"><div class="v ${right?'o':'x'}">${right?'정답!':(k<0?'괜찮아요, 이렇게 외워요':'아쉬워요')}</div><div class="ans">${esc(x.w)} <span class="pos">${esc(x.pos)}</span></div><div>${esc(x.m)}</div>${extra}</div><button class="btn y" onclick="next()">${cur+1<Q.length?'다음 문제 ▶':'결과 보기 ▶'}</button>`;
}
function next(){cur++;if(cur<Q.length)showQ();else result();}
function result(){
  const tot=Q.length,ok=ans.filter(a=>a===1).length,sc=Math.round(ok/tot*100);
  const key=CFG.key+(MODE==='day'?'Day':'Set'),done=ls(key)||{};if(!RETRY){done[N]=Math.max(done[N]||0,sc);ls(key,done);}
  const msg=sc===100?'완벽해요! 이 Day는 졸업':sc>=90?'거의 다 외웠어요':sc>=70?'좋아요, 틀린 단어만 한 번 더':sc>=50?'절반 넘었어요, 다시 풀면 금방 올라가요':'괜찮아요, 단어 목록 보고 다시 도전!';
  const wrong=[...new Set(Q.filter((q,k)=>ans[k]!==1).map(q=>q.i))].map(i=>W(i));
  let h=`<span class="pill">${label()} 결과</span><div class="score">${tot}문제 중 ${ok}개 맞힘</div><div class="big">${sc}점</div><div class="msg">${msg}</div>`;
  h+=`<div class="box">블로그 글 댓글에 <b>「${label()} 완료, ${sc}점」</b>을 남겨 주세요. 매일 기록이 쌓이면 ${CFG.days}일 뒤 ${CFG.goal}가 내 것이 됩니다.</div>`;
  if(wrong.length){h+=`<h3>틀린 단어 ${wrong.length}개</h3>`+wrong.map(x=>`<div class="wl"><div><div class="w">${esc(x.w)} <span class="pos">${esc(x.pos)}</span></div><div class="m">${esc(x.m)}</div></div><button onclick="say('${x.w.replace(/'/g,"\\'")}')">발음 ▶</button></div>`).join('');
    h+=`<button class="btn y" onclick="retryWrong()">틀린 문제만 다시 풀기</button>`;}
  h+=`<button class="btn ${wrong.length?'g':'y'}" onclick="start()">다시 풀기 (새 문제)</button>`;
  h+=`<a class="btn g" href="${esc(blogBack())}">블로그로 돌아가기</a>`;
  if(MODE==='day'){h+=`<div class="row2">${N>1?`<a class="btn g" href="${CFG.self}?day=${N-1}">어제 Day ${N-1}</a>`:'<span></span>'}<a class="btn g" href="${HUB}">전체 Day 보기</a></div>`;
    if(N%S===0)h+=`<a class="btn o" href="${CFG.self}?set=${N/S}">누적 세트 ${N/S} (${CFG.perDay*S}단어 ${CFG.setQ}문제) 도전</a>`;
    if(N<CFG.days)h+=`<div class="box">다음 <b>Day ${N+1}</b>은 블로그에 ${CFG.time}에 올라와요. 이웃 추가하면 새 Day 알림을 받을 수 있어요.</div>`;}
  else h+=`<a class="btn g" href="${HUB}">전체 Day·세트 보기</a>`;
  app().innerHTML=h+foot();window.scrollTo(0,0);
}
function retryWrong(){RETRY=true;Q=shuf(Q.filter((q,k)=>ans[k]!==1)).map(q=>{const o=shuf(q.opts.map((v,k)=>({v,ok:k===q.ok})));return Object.assign({},q,{opts:o.map(z=>z.v),ok:o.findIndex(z=>z.ok)})});cur=0;ans=[];showQ();}
function foot(){return `<div class="ft">${CFG.foot}<br>곽승범 원장 · 유튜브 영어 혁명</div>`}
init();
</script></body></html>
