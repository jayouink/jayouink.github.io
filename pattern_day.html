<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} body{margin:0;background:#1b2340;color:#fff;font-family:Pretendard,system-ui,sans-serif;font-size:19px}

h1{font-size:32px;line-height:1.3;margin:14px 0 8px;font-weight:900} .sub{color:#c3cbe6;font-size:19px;line-height:1.65}
.box{background:#26305a;border-radius:16px;padding:18px;margin-top:16px;font-size:19px;line-height:1.7;color:#e6eaf7} .box b{color:#fff}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:20px 14px;font-size:22px;font-weight:900;font-family:inherit;cursor:pointer;margin-top:14px;text-align:center;text-decoration:none;line-height:1.3}
.btn.y{background:#FFD54A;color:#111} .btn.g{background:#2d3866;color:#fff} .btn.o{background:transparent;color:#FFD54A;border:3px solid #FFD54A}

.pc .no{font-size:16px;font-weight:900;color:#2f5a8f} .pc .pt{font-size:27px;font-weight:900;margin:6px 0 4px;line-height:1.3} .pc .mn{font-size:21px;font-weight:800;color:#b5361f}

.ex .e{font-size:22px;font-weight:800;line-height:1.4} .ex .p{font-size:18px;color:#5b6283;margin-top:4px} .ex .k{font-size:19px;margin-top:4px}
.play{border:0;background:#1b2340;color:#FFD54A;border-radius:24px;padding:11px 18px;font-size:18px;font-weight:900;font-family:inherit;cursor:pointer;margin-top:10px}

audio{width:100%;margin-top:10px}

.sent{font-size:24px;font-weight:800;line-height:1.6;margin-top:12px} .blank{display:inline-block;min-width:120px;border-bottom:3px solid #1b2340;text-align:center;color:#2f5a8f}

.op:disabled{cursor:default} .op.good{border-color:#1fa968;background:#dff7ea;color:#0d6e41} .op.bad{border-color:#e0443e;background:#fde6e4;color:#b3261e}
.op .n{display:inline-block;width:30px;color:#8a93b8;font-weight:900}
.ans-line{min-height:64px;border:3px dashed #c5cbe0;border-radius:14px;padding:10px;margin-top:14px;font-size:22px;font-weight:800;line-height:1.6;color:#1b2340}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px} .chip{border:3px solid #2f5a8f;background:#e9f0ff;color:#1b2340;border-radius:14px;padding:12px 16px;font-size:22px;font-weight:800;font-family:inherit;cursor:pointer}
.chip.used{visibility:hidden} .rest{color:#7a819e;font-size:20px;margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px} .row2 .btn{margin-top:12px;font-size:19px;padding:18px 8px}

.score{font-size:20px;font-weight:800;margin-top:14px;color:#cfd6ee} .bigs{font-size:64px;font-weight:900;margin:4px 0 2px;color:#FFD54A} .msg{font-size:24px;font-weight:900}
h3{font-size:22px;margin:28px 0 8px;color:#FFD54A}
.wl{background:#26305a;border-radius:14px;padding:14px;margin-top:10px} .wl .e{font-size:21px;font-weight:900;line-height:1.45} .wl .k{font-size:18px;color:#dfe4f5;margin-top:4px}
.wl button{border:0;background:#3a4782;color:#fff;border-radius:18px;padding:9px 14px;font-size:17px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:8px}
.ft{text-align:center;color:#8f99c0;font-size:15px;margin-top:30px;line-height:1.7}
</style></head>
<body><div class="wrap" id="app"><p class="sub">불러오는 중...</p></div>
<script>
const CFG={key:'pt',data:'pattern_data.json',posts:'pattern_posts.json',hub:'pattern.html',self:'pattern_day.html',cat:'https://blog.naver.com/jayouink2',days:50,per:2,setDays:10,time:'아침 9시 30분',v:1};
let D=null,POSTS={days:{},sets:{},cat:CFG.cat},MODE='day',N=1,PS=[],Q=[],cur=0,ans=[],RETRY=false,AUD=null;
const $=s=>document.querySelector(s),app=()=>$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v));}catch(e){return null}}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
const P=no=>D.items[no-1], EX=id=>{const [n,k]=id.split('_').map(Number);return Object.assign({id,no:n,k},P(n).ex[k-1]);};
let VOICE=null;function pickVoice(){try{const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>v.lang==='en-US'&&/Samantha|Google US|Aria|Jenny|Guy/i.test(v.name))||vs.find(v=>v.lang==='en-US')||vs.find(v=>/^en/.test(v.lang))||null;}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice();}catch(e){}
function tts(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(VOICE)u.voice=VOICE;u.rate=.85;speechSynthesis.speak(u);}catch(e){}}
function stopAll(){try{if(AUD){AUD.pause();}}catch(e){} try{speechSynthesis.cancel()}catch(e){}}
function play(id){stopAll();const x=EX(id);AUD=new Audio(x.au);AUD.onerror=()=>tts(x.en);const pr=AUD.play();if(pr&&pr.catch)pr.catch(()=>tts(x.en));}
function blogDay(d){return (POSTS.days&&POSTS.days[d])||POSTS.cat||CFG.cat}
function blogBack(){return MODE==='day'?blogDay(N):((POSTS.sets&&POSTS.sets[N])||blogDay(N*CFG.setDays))}
function label(){return MODE==='day'?`Day ${N}`:`누적 테스트 ${N}`}
async function init(){
  const p=new URLSearchParams(location.search);
  if(p.get('set')){MODE='set';N=Math.min(CFG.days/CFG.setDays,Math.max(1,parseInt(p.get('set'))||1));}else{MODE='day';N=Math.min(CFG.days,Math.max(1,parseInt(p.get('day'))||1));}
  try{const [a,b]=await Promise.all([fetch(CFG.data+'?v='+CFG.v).then(r=>r.json()),fetch(CFG.posts+'?t='+Date.now()).then(r=>r.json()).catch(()=>null)]);D=a;if(b)POSTS=b;}catch(e){app().innerHTML='<p class="sub">자료를 불러오지 못했어요. 새로고침해 주세요.</p>';return}
  PS=MODE==='day'?[2*N-1,2*N]:Array.from({length:20},(_,i)=>(N-1)*20+i+1);
  document.title=`영어 회화 패턴 ${label()} 테스트 | 50일 챌린지`;
  home();
}
function pcard(no){const it=P(no);return `<div class="pc"><div class="no">패턴 ${no}번 · ${esc(it.level)}</div><div class="pt">${esc(it.pattern)}</div><div class="mn">${esc(it.mean)}</div>`+
  it.ex.map((e,k)=>`<div class="ex"><div class="e">${esc(e.en)}</div>${e.pr?`<div class="p">[${esc(e.pr)}]</div>`:''}<div class="k">${esc(e.ko)}</div><button class="play" onclick="play('${no}_${k+1}')">▶ 원어민 듣기</button></div>`).join('')+
  `<div class="tip"><b>팁</b> ${esc(it.tip)}</div><div class="tip"><b>PDF MP3 ${no}번 트랙</b> (우리말 → 영어 → 천천히 영어)<audio controls preload="none" src="${it.track}"></audio></div></div>`;}
function home(){
  const cnt=MODE==='day'?10:20,done=ls(CFG.key+(MODE==='day'?'Day':'Set'))||{},best=done[N];
  let h=`<span class="pill">영어 회화 패턴 50일 챌린지</span>`;
  if(MODE==='day'){
    h+=`<h1>Day ${N}<br>오늘의 패턴 ${PS[0]}·${PS[1]}번</h1><p class="sub">블로그 무료 PDF 「영어 회화 패턴 100」의 ${PS[0]}·${PS[1]}번과 똑같아요. 먼저 소리 내어 따라 말하고, 테스트 10문제로 확인하세요.</p>`;
    if(best!=null)h+=`<div class="box">지난 기록: <b>${best}점</b> 완료</div>`;
    h+=`<button class="btn y" onclick="start()">테스트 10문제 시작 ▶</button>`+PS.map(pcard).join('')+`<button class="btn y" onclick="start()">테스트 10문제 시작 ▶</button>`;
    if(N>1)h+=`<a class="btn o" href="${CFG.self}?day=${N-1}">어제 Day ${N-1} 다시 풀기</a>`;
  }else{
    h+=`<h1>누적 테스트 ${N}<br>Day ${(N-1)*10+1}~${N*10} (패턴 ${PS[0]}~${PS[19]}번)</h1><p class="sub">10일 동안 익힌 20패턴에서 ${cnt}문제가 나와요.</p>`;
    if(best!=null)h+=`<div class="box">지난 기록: <b>${best}점</b> 완료</div>`;
    h+=`<button class="btn y" onclick="start()">누적 테스트 ${cnt}문제 시작 ▶</button>`;
  }
  h+=`<a class="btn g" href="${CFG.hub}">전체 Day 1~50 보기</a><a class="btn g" href="${esc(blogBack())}">블로그로 돌아가기</a>`+foot();
  stopAll();app().innerHTML=h;window.scrollTo(0,0);
  if(MODE==='day'&&new URLSearchParams(location.search).get('listen')){const el=document.querySelector('.pc');if(el)el.scrollIntoView();}
}
// ---------- question builders ----------
function pool(){return PS.flatMap(no=>[no+'_1',no+'_2'])}
function sameLevelIds(no){const lv=P(no).level;return D.items.filter(i=>i.level===lv).flatMap(i=>[i.no+'_1',i.no+'_2'])}
function pickDis(id,cands,n,key){const x=EX(id),bad=new Set(x.bad),seen=new Set([key(x)]),out=[];
  for(const c of shuf(cands)){if(out.length>=n)break;const y=EX(c);if(y.no===x.no||bad.has(c))continue;const kv=key(y);if(seen.has(kv))continue;seen.add(kv);out.push(c);}
  if(out.length<n){for(const c of shuf(D.items.flatMap(i=>[i.no+'_1',i.no+'_2']))){if(out.length>=n)break;const y=EX(c);if(y.no===x.no||bad.has(c))continue;const kv=key(y);if(seen.has(kv))continue;seen.add(kv);out.push(c);}}
  return out;}
function qListen(id){const dis=pickDis(id,MODE==='day'?pool():sameLevelIds(EX(id).no),3,y=>y.ko);const opts=shuf([id,...dis]);return {t:'L',id,opts,ok:opts.indexOf(id)}}
function capFit(s,atStart){if(atStart)return s.charAt(0).toUpperCase()+s.slice(1);return /^I\b|^I'/.test(s)?s:s.charAt(0).toLowerCase()+s.slice(1)}
function qFill(id){const x=EX(id),st=x.en.indexOf(x.core)===0,g=new Set(P(x.no).grp);
  const cands=shuf((MODE==='day'?PS.concat(shuf(D.items.filter(i=>i.level===P(x.no).level).map(i=>i.no))):shuf(D.items.filter(i=>i.level===P(x.no).level).map(i=>i.no)))).filter(n=>n!==x.no&&!g.has(n));
  const seen=new Set([x.core.toLowerCase()]),dis=[];
  for(const n of cands){if(dis.length>=3)break;const c=P(n).ex[0].core;const cf=capFit(c,st);if(seen.has(cf.toLowerCase()))continue;seen.add(cf.toLowerCase());dis.push(cf);}
  const right=capFit(x.core,st),opts=shuf([right,...dis]);return {t:'F',id,opts,ok:opts.indexOf(right)}}
function ordPick(no){const it=P(no);const sc=e=>(!e.part&&e.ord.length>=4&&e.ord.length<=10)?0:(!e.part&&e.ord.length<=13)?1:(e.part&&e.ord.length>=4)?2:3;
  const s=[0,1].map(k=>[sc(it.ex[k]),Math.random(),k]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);return no+'_'+(s[0][2]+1)}
function qOrder(id){const x=EX(id);return {t:'O',id,tok:shuf(x.ord.map((w,i)=>({w,i}))),sel:[]}}
function qSit(no){const it=P(no),id=no+'_'+it.sit[0];const dis=pickDis(id,MODE==='day'?pool().concat(sameLevelIds(no)):sameLevelIds(no),3,y=>y.en);const opts=shuf([id,...dis]);return {t:'S',id,opts,ok:opts.indexOf(id),sit:it.sit[1]}}
function start(){
  RETRY=false;Q=[];
  if(MODE==='day'){const [a,b]=PS;
    shuf(pool()).forEach(id=>Q.push(qListen(id)));
    const oa=ordPick(a),ob=ordPick(b);const fa=oa.endsWith('_1')?a+'_2':a+'_1',fb=ob.endsWith('_1')?b+'_2':b+'_1';
    shuf([fa,fb]).forEach(id=>Q.push(qFill(id)));shuf([oa,ob]).forEach(id=>Q.push(qOrder(id)));shuf([a,b]).forEach(no=>Q.push(qSit(no)));
  }else{const s=shuf(PS);const L=s.slice(0,5),F=s.slice(5,10),O=s.slice(10,15),S=s.slice(15,20);
    L.forEach(no=>Q.push(qListen(no+'_'+(1+Math.floor(Math.random()*2)))));F.forEach(no=>Q.push(qFill(no+'_'+(1+Math.floor(Math.random()*2)))));O.forEach(no=>Q.push(qOrder(ordPick(no))));S.forEach(no=>Q.push(qSit(no)));}
  cur=0;ans=[];showQ();
}
const TNAME={L:'듣고 뜻 고르기',F:'빈칸 채우기',O:'순서대로 누르기',S:'상황에 맞는 말 고르기'};
function showQ(){
  stopAll();const q=Q[cur],x=EX(q.id),tot=Q.length;
  let h=`<div class="prog"><span>${label()} · ${cur+1} / ${tot}</span><span>맞힌 수 ${ans.filter(a=>a===1).length}</span></div><div class="bar"><i style="width:${cur/tot*100}%"></i></div><div class="card"><div class="qt">${TNAME[q.t]}</div>`;
  if(q.t==='L'){h+=`<div class="qk">원어민 음성을 듣고, 알맞은 뜻을 고르세요.</div><button class="big-play" onclick="play('${q.id}')">▶ 소리 듣기</button><div class="opts">`+q.opts.map((o,k)=>`<button class="op" id="op${k}" onclick="pick(${k})"><span class="n">${k+1}</span>${esc(EX(o).ko)}</button>`).join('')+`</div>`;}
  if(q.t==='F'){const s=esc(x.en).replace(esc(x.core),'<span class="blank">?</span>');h+=`<div class="qk">${esc(x.ko)}</div><div class="sent">${s}</div><div class="opts">`+q.opts.map((o,k)=>`<button class="op" id="op${k}" onclick="pick(${k})"><span class="n">${k+1}</span>${esc(o)}</button>`).join('')+`</div>`;}
  if(q.t==='S'){h+=`<div class="qk">${esc(q.sit)}</div><div class="opts">`+q.opts.map((o,k)=>`<button class="op" id="op${k}" onclick="pick(${k})"><span class="n">${k+1}</span>${esc(EX(o).en)}</button>`).join('')+`</div>`;}
  if(q.t==='O'){const rest=x.part?x.en.replace(x.part,'').trim():'';const before=x.part&&x.en.indexOf(x.part)>0;
    h+=`<div class="qk">${esc(x.ko)}</div><div class="rest">단어를 순서대로 누르세요. 잘못 누르면 그 단어를 다시 누르면 빠져요.</div>${rest&&before?`<div class="rest">${esc(rest)}</div>`:''}<div class="ans-line" id="al"></div>${rest&&!before?`<div class="rest">${esc(rest)}</div>`:''}<div class="chips" id="chips"></div><button class="btn y" id="chk" onclick="checkOrder()" style="display:none">확인하기</button>`;}
  h+=`<button class="skip" id="skp" onclick="pick(-1)">모르겠어요</button><div id="fb"></div></div>`;
  app().innerHTML=h;window.scrollTo(0,0);
  if(q.t==='O')drawOrder();
  if(q.t==='L')setTimeout(()=>play(q.id),350);
}
function drawOrder(){const q=Q[cur],x=EX(q.id);
  $('#al').innerHTML=q.sel.map((ti,j)=>`<button class="chip" onclick="unsel(${j})">${esc(q.tok[ti].w)}</button>`).join(' ')+(q.sel.length===q.tok.length?esc(x.end):'');
  $('#chips').innerHTML=q.tok.map((t,i)=>`<button class="chip ${q.sel.includes(i)?'used':''}" onclick="sel(${i})">${esc(t.w)}</button>`).join('');
  $('#chk').style.display=q.sel.length===q.tok.length?'block':'none';}
function sel(i){const q=Q[cur];if(ans[cur]!==undefined||q.sel.includes(i))return;q.sel.push(i);drawOrder();}
function unsel(j){const q=Q[cur];if(ans[cur]!==undefined)return;q.sel.splice(j,1);drawOrder();}
function checkOrder(){const q=Q[cur],x=EX(q.id);const got=q.sel.map(i=>q.tok[i].w).join(' '),want=x.ord.join(' ');finish(got===want,false);}
function pick(k){const q=Q[cur];if(ans[cur]!==undefined)return;
  if(q.t==='O'){finish(false,true);return}
  const right=k===q.ok;document.querySelectorAll('.op').forEach(b=>b.disabled=true);$('#op'+q.ok).classList.add('good');if(k>=0&&!right)$('#op'+k).classList.add('bad');finish(right,k<0);}
function finish(right,skipped){const q=Q[cur],x=EX(q.id),it=P(x.no);ans[cur]=right?1:0;$('#skp').style.display='none';
  if(q.t==='O'){document.querySelectorAll('.chip').forEach(b=>b.disabled=true);const c=$('#chk');if(c)c.style.display='none';}
  $('#fb').innerHTML=`<div class="fb"><div class="v ${right?'o':'x'}">${right?'정답이에요!':(skipped?'괜찮아요, 이렇게 말해요':'아쉬워요, 정답은')}</div><div class="a">${esc(x.en)}</div><div>${esc(x.ko)}</div><button class="play" onclick="play('${q.id}')">▶ 원어민 듣기</button><div class="tip" style="margin-top:10px">패턴 ${x.no}번 <b>${esc(it.pattern)}</b> : ${esc(it.mean)}</div></div><button class="btn y" onclick="next()">${cur+1<Q.length?'다음 문제 ▶':'결과 보기 ▶'}</button>`;
  if(q.t!=='L')play(q.id);}
function next(){cur++;if(cur<Q.length)showQ();else result();}
function result(){stopAll();
  const tot=Q.length,ok=ans.filter(a=>a===1).length,sc=Math.round(ok/tot*100);
  const key=CFG.key+(MODE==='day'?'Day':'Set'),done=ls(key)||{};if(!RETRY){done[N]=Math.max(done[N]||0,sc);ls(key,done);}
  const msg=sc===100?'완벽해요! 오늘 패턴은 내 것':sc>=80?'아주 잘하셨어요':sc>=60?'좋아요, 틀린 문제만 한 번 더':'괜찮아요, 소리 내어 따라 말한 뒤 다시 도전!';
  const wrong=Q.map((q,k)=>[q,k]).filter(([q,k])=>ans[k]!==1).map(([q])=>q);
  let h=`<span class="pill">${label()} 결과</span><div class="score">${tot}문제 중 ${ok}개 맞힘${RETRY?' (다시 풀기)':''}</div><div class="bigs">${sc}점</div><div class="msg">${msg}</div>`;
  if(!RETRY)h+=`<div class="box">${label()} 완료 기록이 이 휴대폰에 저장됐어요. 블로그 글 댓글에 <b>「${label()} 완료, ${sc}점」</b>과 오늘 패턴으로 만든 내 문장 하나를 남겨 주세요.</div>`;
  if(wrong.length){h+=`<h3>틀린 문제 ${wrong.length}개</h3>`+wrong.map(q=>{const x=EX(q.id);return `<div class="wl"><div class="e">${esc(x.en)}</div><div class="k">${esc(x.ko)} · 패턴 ${x.no}번</div><button onclick="play('${q.id}')">▶ 듣기</button></div>`}).join('');
    h+=`<button class="btn y" onclick="retryWrong()">틀린 문제만 다시 풀기</button>`;}
  h+=`<button class="btn ${wrong.length?'g':'y'}" onclick="start()">처음부터 다시 풀기</button><a class="btn g" href="${esc(blogBack())}">블로그로 돌아가기</a>`;
  if(MODE==='day'){h+=`<div class="row2">${N>1?`<a class="btn g" href="${CFG.self}?day=${N-1}">어제 Day ${N-1}</a>`:'<span></span>'}<a class="btn g" href="${CFG.hub}">전체 Day 보기</a></div>`;
    if(N%CFG.setDays===0)h+=`<a class="btn o" href="${CFG.self}?set=${N/CFG.setDays}">10일 누적 테스트 ${N/CFG.setDays} 도전</a>`;
    if(N<CFG.days)h+=`<div class="box">다음 <b>Day ${N+1}</b>은 블로그에 ${CFG.time}에 올라와요. 이웃 추가하면 새 글 알림을 받을 수 있어요.</div>`;}
  else h+=`<a class="btn g" href="${CFG.hub}">전체 Day 보기</a>`;
  app().innerHTML=h+foot();window.scrollTo(0,0);
}
function retryWrong(){RETRY=true;const w=Q.filter((q,k)=>ans[k]!==1);Q=w.map(q=>{if(q.t==='L')return qListen(q.id);if(q.t==='F')return qFill(q.id);if(q.t==='O')return qOrder(q.id);return qSit(EX(q.id).no)});cur=0;ans=[];showQ();}
function foot(){return `<div class="ft">영어 회화 패턴 100 · 블로그 무료 PDF와 같은 순서<br>곽승범 원장 · 유튜브 영어 혁명</div>`}
init();
</script></body></html>
