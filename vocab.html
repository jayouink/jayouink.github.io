<script>
const QS = [{"t":"e2k","q":"break","a":"깨다","opts":["깨다","손잡이","두통","앞으로"],"root":"break","why":"기본 뜻"},{"t":"e2k","q":"head","a":"머리","opts":["머리","손","깨다","제목"],"root":"head","why":"기본 뜻"},{"t":"e2k","q":"hand","a":"손","opts":["손","발","머리","마음"],"root":"hand","why":"기본 뜻"},{"t":"e2k","q":"breakfast의 fast","a":"굶다 · 단식","opts":["굶다 · 단식","빠르다","단단한","마지막"],"root":"break","why":"fast에는 \"굶다, 단식\"이라는 뜻도 있어요. 밤새 굶은(fast) 걸 깨는(break) 식사 = breakfast"},{"t":"k2e","q":"아침 식사","a":"breakfast","opts":["breakfast","breakthrough","outbreak","heartbreak"],"root":"break","why":"밤새 굶은(fast) 걸 깨는(break) 식사"},{"t":"k2e","q":"두통","a":"headache","opts":["headache","headline","overhead","ahead"],"root":"head","why":"머리(head) + 아픔(ache)"},{"t":"k2e","q":"편리한","a":"handy","opts":["handy","handle","handout","secondhand"],"root":"hand","why":"손(hand)에 딱 맞는 → 편리한"},{"t":"e2k","q":"handle","a":"다루다 · 손잡이","opts":["다루다 · 손잡이","제출하다","유인물","중고의"],"root":"hand","why":"손(hand)으로 다루는 것"},{"t":"e2k","q":"headline","a":"신문 제목","opts":["신문 제목","두통","머리 위의","~로 향하다"],"root":"head","why":"맨 위 머리(head) 줄(line) → 신문 제목"},{"t":"fill","q":"유인물 = hand____","a":"out","opts":["out","in","le","y"],"root":"hand","why":"손에서 손으로 밖으로(out) 나눠 주는 종이 → handout"},{"t":"fill","q":"중고의 = ______hand","a":"second","opts":["second","first","back","over"],"root":"hand","why":"두 번째(second) 손을 거친 → secondhand"},{"t":"fill","q":"머리 위의 = ____head","a":"over","opts":["over","a","fore","sub"],"root":"head","why":"머리(head) 위(over) → overhead (forehead는 이마)"},{"t":"k2e","q":"앞으로 · 앞에","a":"ahead","opts":["ahead","overhead","headache","head for"],"root":"head","why":"머리(head) 쪽으로(a-) → 앞으로"},{"t":"e2k","q":"head for","a":"~로 향하다","opts":["~로 향하다","머리 위의","신문 제목","두통"],"root":"head","why":"머리(head)를 그쪽으로 돌리다 → ~로 향하다"},{"t":"k2e","q":"(숙제·서류를) 제출하다","a":"hand in","opts":["hand in","hand out","handle","handy"],"root":"hand","why":"손(hand)에 넘겨 주다(in) → 제출하다 (hand out은 나눠 주다)"},{"t":"e2k","q":"break the ice","a":"어색함을 깨다","opts":["어색함을 깨다","기록을 깨다","상심","돌파구"],"root":"break","why":"얼음(ice)처럼 얼어붙은 분위기를 깨다"},{"t":"fill","q":"상심 · 실연 = _____break","a":"heart","opts":["heart","out","day","jail"],"root":"break","why":"마음(heart)이 깨짐 → heartbreak (daybreak는 새벽, jailbreak는 탈옥)"},{"t":"k2e","q":"돌파구","a":"breakthrough","opts":["breakthrough","breakfast","break the ice","outbreak"],"root":"break","why":"깨고(break) 뚫고(through) 나감 → 돌파구"},{"t":"fill","q":"(전쟁·병의) 발생 = ___break","a":"out","opts":["out","heart","day","jail"],"root":"break","why":"밖으로(out) 터져 나옴 → outbreak"},{"t":"k2e","q":"기록을 깨다","a":"break a record","opts":["break a record","break the ice","breakthrough","heartbreak"],"root":"break","why":"기록(record)을 깨다(break)"},{"t":"fill","q":"돌파구 = break_______","a":"through","opts":["through","fast","heart","out"],"root":"break","why":"breakthrough: 깨고 뚫고(through)","ep":1},{"t":"e2k","q":"outbreak","a":"전쟁·병의 발생","opts":["전쟁·병의 발생","돌파구","상심, 실연","아침 식사"],"root":"break","why":"outbreak: 밖으로(out) 터짐","ep":1},{"t":"k2e","q":"다루다 · 손잡이","a":"handle","opts":["handle","handy","handout","secondhand"],"root":"hand","why":"handle: 손(hand)으로 다룸","ep":2},{"t":"e2k","q":"handy","a":"편리한","opts":["편리한","다루다 · 손잡이","제출하다","손글씨"],"root":"hand","why":"handy: 손에 딱 맞음","ep":2},{"t":"fill","q":"유인물 = hand___","a":"out","opts":["out","le","second","writing"],"root":"hand","why":"handout: 손으로 나눠 줌(out)","ep":2},{"t":"e2k","q":"handwriting","a":"손글씨","opts":["손글씨","유인물","중고의","다루다 · 손잡이"],"root":"hand","why":"handwriting: 손으로 씀(writing)","ep":2},{"t":"e2k","q":"ahead","a":"앞으로","opts":["앞으로","두통","머리 위의","본사 · 본부"],"root":"head","why":"ahead: 머리가 향하는 쪽","ep":3},{"t":"fill","q":"신문 제목 = head____","a":"line","opts":["line","ache","over","quarters"],"root":"head","why":"headline: 맨 위 머리 줄(line)","ep":3},{"t":"e2k","q":"headquarters","a":"본사 · 본부","opts":["본사 · 본부","신문 제목","~로 향하다","두통"],"root":"head","why":"headquarters: 머리 역할 하는 곳","ep":3}];
const TIERS = [[100,'상위 3%','꼬리 물기 마스터! 단어의 뿌리까지 보이는 수준이에요.'],[90,'상위 10%','거의 다 맞혔어요. 단어가 만들어진 원리를 잘 알고 있어요.'],[80,'상위 20%','탄탄해요. 헷갈린 단어만 다시 보면 완벽해요.'],[70,'상위 30%','기본은 충분해요. 뿌리 단어로 뜻을 추측하는 연습을 더 해 보세요.'],[60,'상위 50%','절반 넘게 맞혔어요. 꼬리 물기 쇼츠로 복습하면 금방 올라가요.'],[40,'상위 70%','처음 보는 단어가 많았을 거예요. 뿌리 단어부터 다시 시작해요.'],[0,'','오늘 배운 단어부터 하나씩! 꼬리 물기 쇼츠로 복습해 보세요.']];
const KIND = {e2k:'영어 → 뜻', k2e:'뜻 → 영어', fill:'빈칸 채우기'};
const app = document.getElementById('app'); let Q=[], ans=[], cur=0, t0=0;
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
let AC=null; function beep(f,d,v){ try { AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if (AC.state==='suspended') AC.resume(); const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,AC.currentTime); g.gain.exponentialRampToValueAtTime(v,AC.currentTime+0.01); g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d); o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+d+0.05); } catch(e){} }
function shuffle(a){ a=a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function tierOf(sc){ for (const t of TIERS) if (sc>=t[0]) return t; return TIERS[TIERS.length-1]; }
function qText(q){ if (q.t==='e2k') return '<span class="r">'+esc(q.q)+'</span>의 뜻은?'; if (q.t==='k2e') return '"'+esc(q.q)+'"을(를) 영어로?'; return esc(q.q).replace(/_+/, m=>'<span class="r">'+m+'</span>'); }
function home(){ const last = store.get('vcLast');
  app.innerHTML = '<span class="pill">단어 꼬리 물기 테스트</span><h1>꼬리를 물면 뜻이 보인다,<br>당신은 상위 몇 %?</h1><div class="sub">단어 꼬리 물기 쇼츠에 나온 단어 20문제예요. 약 3분, 끝까지 풀면 자동 채점하고 단어마다 \'왜 이 뜻인지\' 해설을 보여 드려요.</div>'+
  (last?'<div class="box">지난 결과: <b>'+last.sc+'점</b>'+(last.top?' · '+esc(last.top):'')+' ('+last.d+')</div>':'')+
  '<button class="btn y" onclick="start()">테스트 시작하기</button>'+
  '<div class="box"><b>이렇게 풀어요</b><br>1. 영어 → 뜻, 뜻 → 영어, 빈칸 채우기 세 가지 문제가 나와요.<br>2. 정답은 끝날 때까지 알려 주지 않아요. 이전 문제로 돌아가 바꿀 수 있어요.<br>3. 한 문제 5점, 100점 만점이에요. 풀 때마다 문제가 새로 섞여요.</div>'+
  '<div class="box"><b>출제 뿌리 단어 3개</b><br>break(깨다) · head(머리) · hand(손)</div>'+
  '<a class="btn g" href="level.html">영어 문법도 확인! 20문제 레벨 테스트</a><div class="ft">곽승범 원장 · 유튜브 영어 혁명</div>'; window.scrollTo(0,0); }
function pick20(){ const by={}; QS.forEach(q=>{ (by[q.root]=by[q.root]||[]).push(q); }); const ks=shuffle(Object.keys(by)); ks.forEach(k=>by[k]=shuffle(by[k])); const out=[]; let r=0, guard=0; while(out.length<Math.min(20,QS.length) && guard<5000){ const k=ks[r%ks.length]; if(by[k].length) out.push(by[k].pop()); r++; guard++; } return shuffle(out); }
function start(){ Q = pick20().map(q=>({...q, sh: shuffle(q.opts)})); ans = Q.map(()=>undefined); cur=0; t0=Date.now(); show(); }
function show(){ const q=Q[cur]; const a=ans[cur];
  app.innerHTML = '<span class="pill">단어 꼬리 물기 테스트</span><div class="prog"><span>'+(cur+1)+' / '+Q.length+'</span><span style="font-size:12.5px;color:#8a93b8">푼 문제 '+ans.filter(x=>x!==undefined).length+'개</span></div><div class="bar"><i style="width:'+((cur+1)/Q.length*100)+'%"></i></div>'+
  '<div class="card"><div class="kind">'+KIND[q.t]+'</div><div class="qq">'+qText(q)+'</div><div class="opts">'+q.sh.map((o,i)=>'<button class="opt'+(a===o?' pick':'')+'" data-o="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div></div>'+
  '<div class="row2"><button class="btn g" onclick="go(-1)" '+(cur===0?'disabled':'')+'>이전</button><button class="btn y" id="nx" onclick="go(1)" '+(a===undefined?'disabled':'')+'>'+(cur===Q.length-1?'채점하기':'다음')+'</button></div>'+
  '<div class="dots">'+Q.map((_,i)=>'<span class="'+(i===cur?'c':ans[i]!==undefined?'a':'')+'"></span>').join('')+'</div>';
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ ans[cur]=b.dataset.o; beep(660,0.08,0.12); show(); });
  window.scrollTo(0,0); }
function go(d){ if (d>0 && cur===Q.length-1) return result(); cur=Math.max(0,Math.min(Q.length-1,cur+d)); show(); }
function result(){ const ok = Q.map((q,i)=>ans[i]===q.a); const n=ok.filter(Boolean).length; const sc=n*5; const t=tierOf(sc); const sec=Math.round((Date.now()-t0)/1000);
  const dt=new Date(); store.set('vcLast',{sc, top:t[1], d:(dt.getMonth()+1)+'/'+dt.getDate()}); window.__result={sc,n,top:t[1]};
  [523.3,659.3,784].forEach((f,i)=>setTimeout(()=>beep(f,0.25,0.18), i*120));
  const byR={}; Q.forEach((q,i)=>{ byR[q.root]=byR[q.root]||[0,0]; byR[q.root][1]++; if(ok[i]) byR[q.root][0]++; });
  const meter=(k,v)=>'<div class="meter"><div class="lb"><span>'+esc(k)+'</span><span>'+v[0]+' / '+v[1]+'</span></div><div class="tr"><i style="width:'+(v[0]/v[1]*100)+'%;background:'+(v[0]===v[1]?'#5fcf96':'#FFD54A')+'"></i></div></div>';
  app.innerHTML = '<span class="pill">단어 꼬리 물기 테스트 결과</span><div class="score">'+n+' / 20문제 정답 · '+Math.floor(sec/60)+'분 '+(sec%60)+'초</div><div class="big">'+sc+'점</div><div class="lvname">'+(t[1]?'당신은 '+t[1]:'다시 도전!')+'</div>'+
  '<div class="box" style="margin-top:12px">'+t[2]+'</div><h3>뿌리 단어별 정답</h3>'+Object.entries(byR).map(([k,v])=>meter(k+' 꼬리',v)).join('')+
  '<button class="btn y" onclick="share()">결과 공유하기</button><button class="btn g" onclick="start()">다시 풀기</button>'+
  '<h3>문제별 해설</h3>'+Q.map((q,i)=>'<div class="rv"><div class="h"><span>'+(i+1)+'번 · '+KIND[q.t]+'</span><span class="'+(ok[i]?'o':'x')+'">'+(ok[i]?'○ +5점':'✕ 0점')+'</span></div><div class="s">'+esc(q.q)+'</div>'+(ok[i]?'':'<div class="y">내 답: '+esc(ans[i]||'안 풂')+'</div>')+'<div class="ok">→ '+esc(q.a)+'</div><div class="y">'+esc(q.why)+'</div></div>').join('')+
